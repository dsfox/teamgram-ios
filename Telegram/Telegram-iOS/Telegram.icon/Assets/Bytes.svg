<?xml version="1.0" encoding="UTF-8"?>
<!-- 2bytes: two bytes, drawn as two turns of a conversation.
     Two separated forms is the whole mark. They were overlapping at first and
     merged into one blob; the gap is what makes the pair readable, and it holds
     at 40pt where anything finer turns to mush. -->
<svg width="1024px" height="1024px" viewBox="0 0 1024 1024" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
    <title>Bytes</title>
    <g id="Bytes" stroke="none" fill="#FFFFFF" fill-rule="nonzero">
        <rect x="168" y="212" width="392" height="292" rx="100" ry="100"/>
        <rect x="464" y="520" width="392" height="292" rx="100" ry="100"/>
    </g>
</svg>
